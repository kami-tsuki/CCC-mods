name: KamiLibs

on:
  push:
    branches: [main, master, develop, 'release**']
    paths:
      - 'KamiLibs/**'
      - 'build.gradle.kts'
      - 'settings.gradle.kts'
      - 'gradle.properties'
      - 'gradle/**'
      - '.github/workflows/_mod-ci.yml'
      - '.github/workflows/KamiLibs.yml'

jobs:
  ci:
    uses: ./.github/workflows/_mod-ci.yml
    with:
      mod: KamiLibs
